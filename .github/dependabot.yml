version: 2
updates:
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: build
      ignore:
          # Its majors follow Bun's; bumped by hand with the Bun floor.
          - dependency-name: "@types/bun"
            update-types: ["version-update:semver-major"]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: ci
